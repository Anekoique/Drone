# Compass heading (degrees), used to rotate waypoints to field orientation
headingangle_compass: 349.0

# Drop zone origin offset from home (meters)
dx_shot: 0.0
dy_shot: 30.0

# Recon zone origin offset from home (meters)
dx_see: 0.0
dy_see: 54.7

# Drop zone cruise altitude (meters)
shot_halt: 4.5
shot_halt_surround: 3.0
shot_halt_low: 1.8

# Recon zone cruise altitude (meters)
see_halt: 3.5

# Camera offset relative to drone center (meters)
drone_to_camera_x: 0.0
drone_to_camera_y: 0.19
drone_to_camera_z: 0.141

# Servo PWM positions
servo_open_position: 1980
servo_close_position: 1200

# Whether to prefer the largest container for airdrop
shot_big_target: true
