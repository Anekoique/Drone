# Camera device path (V4L2 or CSI)
camera_device: /dev/video0

# TensorRT model path (relative to package share or absolute)
model_path: model/best.engine

# Camera intrinsic parameters
fx: 611.4
fy: 610.7
cx: 637.2
cy: 367.9

# Distortion coefficients (k1, k2, p1, p2, k3)
k1: 0.108
k2: -0.137
p1: -0.001
p2: 0.001
k3: 0.050

# Image resolution (pixels)
width: 1280
height: 720

# Kalman filter parameters
process_noise: 0.015              # Lower for smoother trajectory
measurement_noise: 0.5            # Adjust based on YOLO detection precision
moving_average_window: 3          # Smoothing window size (3-5 frames)
outlier_threshold: 100.0          # Measurements beyond this distance (px) are rejected
stability_threshold: 10.0         # Consecutive change below this (px) is considered stable
filter_confidence_threshold: 0.6  # Use filtered result above this confidence
