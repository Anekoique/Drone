name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format
      - name: Check formatting
        run: |
          clang-format --version
          find include src -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --style=file --dry-run --Werror

  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            python3-colcon-common-extensions \
            ros-humble-ament-cmake \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-ament-cmake-gtest \
            ros-humble-eigen3-cmake-module \
            ros-humble-ament-index-cpp \
            ros-humble-vision-msgs \
            ros-humble-rclcpp \
            ros-humble-cv-bridge \
            ros-humble-mavros-msgs \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs \
            ros-humble-sensor-msgs \
            ros-humble-std-msgs \
            libeigen3-dev \
            libyaml-cpp-dev \
            libopencv-dev
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p /ci/src && ln -s $GITHUB_WORKSPACE /ci/src/drone
          cd /ci
          colcon build --packages-select drone --cmake-args -DBUILD_TESTING=ON
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd /ci
          colcon test --packages-select drone
          colcon test-result --all --verbose
